<?xml version="1.0" encoding="UTF-8"?>
<!-- Port de resources/views/pdf/formats/ticket_58.blade.php de API-PRO. -->
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <style th:replace="~{styles :: base}"></style>
    <style th:replace="~{styles :: ticket}"></style>
    <style th:inline="text">
        @page { size: [[${page_size}]]; }
        @page { margin: 3mm; }
        body { font-size: 8pt; color: #222; }

        /* Header */
        .header-section { padding-bottom: 4px; }
        .header-section img { max-width: 55px; max-height: 55px; }
        .emitter-name { font-size: 9pt; }
        .emitter-ruc { font-size: 8.5pt; }
        .emitter-address { font-size: 7pt; }

        /* Badge */
        .document-badge { padding: 4px 5px; margin: 6px 0; }
        .badge-title { font-size: 8.5pt; }
        .badge-number { font-size: 10pt; }
        .badge-date { font-size: 7.5pt; }

        /* Info */
        .info-line { font-size: 7.5pt; }
        .info-block { padding: 4px 0; }

        /* Items */
        .items-table-ticket thead th { font-size: 7pt; padding: 2px 1px; }
        .items-table-ticket tbody td { font-size: 8pt; padding: 2px 1px; }
        .items-table-ticket .item-qty-detail { font-size: 7pt; }

        /* Totals */
        .totals-table-ticket td { font-size: 8pt; }
        .totals-table-ticket .total-final td { font-size: 9.5pt; }

        /* Others */
        .leyenda { font-size: 7pt; padding: 3px; }
        .qr-section img { width: 75px; height: 75px; }
        .footer-section { font-size: 6.5pt; }
        .footer-hash { font-size: 6.5pt; }
        .footer-legal { font-size: 6.5pt; }
        .note-reference { font-size: 7.5pt; padding: 4px; }
        .note-reference .ref-title { font-size: 8pt; }
        .payment-section { font-size: 7.5pt; }
        .payment-title { font-size: 8pt; }
        .payment-table-ticket td { font-size: 7.5pt; }
        .dispatch-section { font-size: 7.5pt; }
        .dispatch-section .section-title { font-size: 7.5pt; }
    </style>
</head>
<body>
    <th:block th:each="section : ${sections}" th:switch="${section}">
        <th:block th:case="'header'"><th:block th:if="${is_ticket}" th:insert="~{sections :: header}"></th:block></th:block>
        <th:block th:case="'document-badge'"><th:block th:if="${is_ticket}" th:insert="~{sections :: document_badge}"></th:block></th:block>
        <th:block th:case="'receiver'"><th:block th:insert="~{sections :: receiver}"></th:block></th:block>
        <th:block th:case="'note-reference'"><th:block th:insert="~{sections :: note_reference}"></th:block></th:block>
        <th:block th:case="'dispatch-info'"><th:block th:insert="~{sections :: dispatch_info}"></th:block></th:block>
        <th:block th:case="'items'"><th:block th:insert="~{sections :: items}"></th:block></th:block>
        <th:block th:case="'totals'"><th:block th:insert="~{sections :: totals}"></th:block></th:block>
        <th:block th:case="'leyenda'"><th:block th:insert="~{sections :: leyenda}"></th:block></th:block>
        <th:block th:case="'payment-info'"><th:block th:insert="~{sections :: payment_info}"></th:block></th:block>
        <th:block th:case="'bank-accounts'"><th:block th:insert="~{sections :: bank_accounts}"></th:block></th:block>
        <th:block th:case="'qr-code'"><th:block th:insert="~{sections :: qr_code}"></th:block></th:block>
        <th:block th:case="'retention-info'"><th:block th:insert="~{sections :: retention_info}"></th:block></th:block>
        <th:block th:case="'retention-items'"><th:block th:insert="~{sections :: retention_items}"></th:block></th:block>
        <th:block th:case="'retention-totals'"><th:block th:insert="~{sections :: retention_totals}"></th:block></th:block>
        <th:block th:case="'settlement-info'"><th:block th:insert="~{sections :: settlement_info}"></th:block></th:block>
        <th:block th:case="'settlement-totals'"><th:block th:insert="~{sections :: settlement_totals}"></th:block></th:block>
        <th:block th:case="'footer'"><th:block th:insert="~{sections :: footer}"></th:block></th:block>
    </th:block>
</body>
</html>
