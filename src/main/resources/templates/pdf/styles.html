<?xml version="1.0" encoding="UTF-8"?>
<!-- Estilos de las vistas Blade resources/views/pdf/styles de API-PRO (base, a4, ticket). -->
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<style th:fragment="base">
body {
        font-family: Helvetica, Arial, sans-serif;
        color: #000;
        font-weight: bold;
        line-height: 1.4;
        margin: 0;
        padding: 0;
    }
    h1, h2, h3, h4, h5, h6, p, div, table {
        margin: 0;
        padding: 0;
    }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .text-left { text-align: left; }
    .font-bold { font-weight: bold; }
    .mb-2 { margin-bottom: 4px; }
    .mb-4 { margin-bottom: 8px; }
    .mb-6 { margin-bottom: 12px; }
    .mb-8 { margin-bottom: 16px; }
    .mt-4 { margin-top: 8px; }
    .mt-6 { margin-top: 12px; }
    .separator {
        border-top: 0.5px solid #000;
        margin: 8px 0;
    }
    .separator-dashed {
        border-top: 0.5px dashed #000;
        margin: 6px 0;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
</style>
<style th:fragment="a4">
@page { margin: 20mm 15mm; }
    body { font-size: 10pt; font-weight: bold; color: #000; }
    .header-table { margin-bottom: 12px; }
    .header-table td { vertical-align: top; }
    .logo-cell { width: 80px; }
    .logo-cell img { max-width: 70px; max-height: 70px; }
    .emitter-cell { padding-left: 8px; }
    .emitter-name { font-size: 12pt; font-weight: bold; color: #000; }
    .emitter-ruc { font-size: 9pt; font-weight: bold; color: #000; }
    .emitter-address { font-size: 8pt; font-weight: bold; color: #000; }
    .badge-cell {
        width: 200px;
        text-align: center;
    }
    .document-badge {
        border: 0.5px solid #000;
        padding: 10px 8px;
        text-align: center;
    }
    .badge-title { font-size: 10pt; font-weight: bold; color: #000; }
    .badge-ruc { font-size: 9pt; font-weight: bold; color: #000; margin: 4px 0; }
    .badge-number { font-size: 11pt; font-weight: bold; color: #000; }
    .info-section {
        margin-bottom: 10px;
        border-bottom: 0.5px solid #000;
        padding: 6px 0;
        font-size: 9pt;
        font-weight: bold;
        color: #000;
    }
    .info-section td { padding: 2px 4px; vertical-align: top; }
    .info-label { color: #000; font-weight: bold; width: 130px; }
    .items-table {
        margin-bottom: 10px;
    }
    .items-table th {
        background: #f5f5f5;
        border-bottom: 0.5px solid #000;
        padding: 5px 4px;
        font-size: 8pt;
        font-weight: bold;
        text-align: center;
        color: #000;
    }
    .items-table td {
        border-bottom: 0.5px solid #000;
        padding: 4px;
        font-size: 8.5pt;
        font-weight: bold;
        color: #000;
    }
    .items-table tr:nth-child(even) { background: #fafafa; }
    .totals-table {
        width: 280px;
        float: right;
        margin-bottom: 10px;
    }
    .totals-table td {
        padding: 3px 6px;
        font-size: 9pt;
        font-weight: bold;
        color: #000;
    }
    .totals-table .total-label { text-align: right; color: #000; }
    .totals-table .total-value { text-align: right; width: 100px; color: #000; }
    .totals-table .total-final td {
        font-weight: bold;
        font-size: 10pt;
        border-top: 0.5px solid #000;
        color: #000;
        padding-top: 5px;
    }
    .leyenda {
        clear: both;
        font-size: 8.5pt;
        font-weight: bold;
        color: #000;
        padding: 6px 0;
        font-style: italic;
    }
    .qr-section { margin-top: 8px; }
    .qr-section img { width: 100px; height: 100px; }
    .footer-section {
        font-size: 7.5pt;
        font-weight: bold;
        color: #000;
        margin-top: 6px;
        padding-top: 6px;
        border-top: 0.5px solid #000;
    }
    .payment-section {
        font-size: 8.5pt;
        font-weight: bold;
        margin-bottom: 8px;
        padding: 6px 0;
        border-bottom: 0.5px solid #000;
        color: #000;
    }
    .note-reference {
        font-size: 9pt;
        font-weight: bold;
        margin-bottom: 8px;
        padding: 6px 8px;
        border-left: 2px solid #000;
        color: #000;
    }
    .dispatch-section {
        font-size: 9pt;
        font-weight: bold;
        margin-bottom: 8px;
        color: #000;
    }
    .dispatch-section table td { padding: 2px 4px; }
    .dispatch-section .section-title {
        font-weight: bold;
        color: #000;
        font-size: 9pt;
        margin-bottom: 4px;
        padding-bottom: 2px;
        border-bottom: 0.5px solid #000;
    }
</style>
<style th:fragment="ticket">
@page { margin: 5mm 4mm; }
    body { font-size: 9pt; line-height: 1.3; color: #000; font-weight: bold; }

    /* ── HEADER — Empresa ── */
    .header-section {
        text-align: center;
        padding-bottom: 6px;
        border-bottom: 0.5px dashed #000;
        margin-bottom: 6px;
    }
    .header-section img {
        max-width: 70px;
        max-height: 70px;
        margin-bottom: 4px;
    }
    .emitter-name {
        font-size: 11pt;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        margin-bottom: 2px;
        color: #000;
    }
    .emitter-ruc {
        font-size: 10pt;
        font-weight: bold;
        margin-bottom: 2px;
        color: #000;
    }
    .emitter-address {
        font-size: 8pt;
        color: #000;
        font-weight: bold;
        line-height: 1.3;
    }

    /* ── BADGE — Tipo de Comprobante ── */
    .document-badge {
        text-align: center;
        padding: 5px 6px;
        margin: 6px 0;
        border-top: 0.5px dashed #000;
        border-bottom: 0.5px dashed #000;
    }
    .badge-title {
        font-size: 10pt;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #000;
    }
    .badge-number {
        font-size: 12pt;
        font-weight: bold;
        margin: 3px 0 2px;
        letter-spacing: 0.5px;
        color: #000;
    }
    .badge-date {
        font-size: 8.5pt;
        font-weight: bold;
        color: #000;
    }

    /* ── INFO — Datos del cliente ── */
    .info-block {
        margin: 6px 0;
        padding: 5px 0;
        border-top: 0.5px dashed #000;
        border-bottom: 0.5px dashed #000;
    }
    .info-line {
        font-size: 8.5pt;
        font-weight: bold;
        margin-bottom: 2px;
        line-height: 1.4;
        color: #000;
    }
    .info-label {
        font-weight: bold;
        color: #000;
    }

    /* ── SECTION TITLE ── */
    .section-title-bar {
        font-size: 8.5pt;
        font-weight: bold;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        padding: 3px 0;
        border-top: 0.5px dashed #000;
        border-bottom: 0.5px dashed #000;
        margin: 6px 0 4px;
        color: #000;
    }

    /* ── ITEMS — Tabla de productos ── */
    .items-table-ticket {
        width: 100%;
        border-collapse: collapse;
        margin-top: 6px;
        color: #000;
    }
    .items-table-ticket thead th {
        font-size: 8pt;
        font-weight: bold;
        text-transform: uppercase;
        padding: 3px 2px;
        border-bottom: 0.5px solid #000;
        color: #000;
        text-align: left;
    }
    .items-table-ticket thead th.col-right {
        text-align: right;
    }
    .items-table-ticket tbody td {
        font-size: 8.5pt;
        font-weight: bold;
        padding: 3px 2px;
        border-bottom: 0.5px dotted #000;
        color: #000;
        vertical-align: top;
    }
    .items-table-ticket tbody td.col-right {
        text-align: right;
        font-weight: bold;
    }
    .items-table-ticket .item-qty-detail {
        font-size: 7.5pt;
        font-weight: bold;
        color: #000;
    }

    /* ── TOTALS — Tabla de montos ── */
    .totals-section {
        margin-top: 6px;
        padding-top: 4px;
        border-top: 0.5px dashed #000;
    }
    .totals-table-ticket {
        width: 100%;
        border-collapse: collapse;
        color: #000;
    }
    .totals-table-ticket td {
        font-size: 8.5pt;
        font-weight: bold;
        padding: 2px 0;
        color: #000;
    }
    .totals-table-ticket .total-label {
        text-align: left;
        color: #000;
    }
    .totals-table-ticket .total-value {
        text-align: right;
        color: #000;
    }
    .totals-table-ticket .total-separator td {
        border-top: 0.5px dotted #000;
        padding-top: 3px;
    }
    .totals-table-ticket .total-final td {
        font-size: 11pt;
        font-weight: bold;
        border-top: 0.5px solid #000;
        padding-top: 4px;
        color: #000;
    }

    /* ── LEYENDA — Monto en letras ── */
    .leyenda {
        font-size: 7.5pt;
        font-weight: bold;
        color: #000;
        margin: 6px 0;
        padding: 4px;
        text-align: center;
        font-style: italic;
        line-height: 1.3;
        border-top: 0.5px dotted #000;
        border-bottom: 0.5px dotted #000;
    }

    /* ── PAYMENT — Forma de pago ── */
    .payment-section {
        font-size: 8pt;
        font-weight: bold;
        margin: 6px 0;
        padding: 4px 0;
        border-top: 0.5px dashed #000;
        color: #000;
    }
    .payment-title {
        font-weight: bold;
        font-size: 8.5pt;
        margin-bottom: 3px;
        color: #000;
    }
    .payment-table-ticket {
        width: 100%;
        border-collapse: collapse;
        color: #000;
    }
    .payment-table-ticket td {
        font-size: 8pt;
        font-weight: bold;
        padding: 1px 0;
        color: #000;
    }
    .payment-table-ticket .pay-label { text-align: left; }
    .payment-table-ticket .pay-value { text-align: right; }

    /* ── NOTE REFERENCE — Doc afectado (NC/ND) ── */
    .note-reference {
        font-size: 8pt;
        font-weight: bold;
        margin: 6px 0;
        padding: 5px;
        border-top: 0.5px dashed #000;
        border-bottom: 0.5px dashed #000;
        color: #000;
    }
    .note-reference .ref-title {
        font-weight: bold;
        font-size: 8.5pt;
        margin-bottom: 2px;
        color: #000;
    }

    /* ── DISPATCH — Datos de transporte ── */
    .dispatch-section {
        font-size: 8pt;
        font-weight: bold;
        margin: 4px 0;
        color: #000;
    }
    .dispatch-section .section-title {
        font-weight: bold;
        font-size: 8.5pt;
        text-align: center;
        padding: 2px 0;
        border-top: 0.5px dashed #000;
        border-bottom: 0.5px dashed #000;
        margin: 4px 0 3px;
        color: #000;
    }

    /* ── QR CODE ── */
    .qr-section {
        text-align: center;
        margin: 8px 0 4px;
    }
    .qr-section img { width: 90px; height: 90px; }

    /* ── FOOTER ── */
    .footer-section {
        font-size: 7pt;
        font-weight: bold;
        color: #000;
        text-align: center;
        margin-top: 4px;
        padding-top: 4px;
        border-top: 0.5px dashed #000;
        line-height: 1.4;
    }
    .footer-hash {
        font-size: 7pt;
        font-weight: bold;
        margin-bottom: 3px;
        word-break: break-all;
        color: #000;
    }
    .footer-legal {
        font-size: 7pt;
        font-weight: bold;
        font-style: italic;
        color: #000;
    }
</style>
</html>
