name: api-sunat-spring-boot

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-sunat-spring-boot:dev
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_PATH: /data/storage
    ports:
      - "${APP_PORT:-8081}:8081"
    volumes:
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-api_sunat_spring_boot}
      POSTGRES_USER: ${DB_USERNAME:-api_sunat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      TZ: UTC
    ports:
      - "${DB_HOST_PORT:-15081}:5432"
    volumes:
      # Postgres 18 guarda los datos en /var/lib/postgresql/18/docker: el volumen va en /var/lib/postgresql
      # (montarlo en .../data, como en la 17, impide arrancar). Un volumen de la 17 no sirve: pg_dump y restaurar.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-16081}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Herramienta de desarrollo: compila y ejecuta las pruebas dentro de Docker.
  #   docker compose run --rm mvn test
  #   docker compose run --rm mvn -q package -DskipTests
  # Testcontainers usa el Docker del host a través del socket.
  mvn:
    image: maven:3.9.16-eclipse-temurin-21
    profiles: ["tools"]
    working_dir: /workspace
    entrypoint: ["mvn", "-B"]
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      TZ: UTC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/workspace
      - m2:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  redisdata:
  storage:
  m2:
